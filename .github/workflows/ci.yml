name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make -C firmware CC=gcc
      - run: pip install pytest hypothesis pyyaml ruff
      - run: ruff check .
      - run: pytest --require-coverage -q
      - run: pytest --pumpctl build/pumpctl -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            results/test_report.md
            results/traceability.md

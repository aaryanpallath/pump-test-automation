[project]
name = "pump-test-automation"
version = "0.1.0"
description = "End-to-end pytest automation for a simulated blood pump controller (C) with requirements traceability"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pytest>=8", "hypothesis>=6.100", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["req(*ids): requirement IDs from requirements.yaml that this test verifies"]
